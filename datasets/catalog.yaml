# Dataset catalog — machine-readable registry of verified real-world datasets.
#
# Schema per entry:
#   id, name, organization, hf_id (if hosted), canonical_url, paper (arXiv id+url),
#   risk_area, task, license (as observed, + where observed), size facts
#   (each with a reference marker [Rn] resolved in the card),
#   course_use (chapters, projects), access_level, verified_on, card path,
#   references (url -> facts collected from that url, with access date).
#
# Honesty rules (inherited from research/source-register.yaml):
# - "license.as_observed" is what the named page displayed on verified_on.
# - Row counts are dated observations of hosted pages, not permanent truths.
# - access_level follows the repository convention: page-inspected |
#   abstract-read | metadata-only. No card fact may cite metadata-only.

