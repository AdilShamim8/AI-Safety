    assumptions: "the abstract faithfully summarizes the audit; per-model tables are consistent with it"
    counterevidence: >-
      none at this access level; the one exception model is unnamed in the abstract
    date: 2026-10-22

  - id: CLM-0063
    claim: >-
      BadNets demonstrated training-time backdoors in the model supply chain: a US street-sign classifier identifying stop signs as speed limits under a trigger sticker, an average 25% accuracy drop when the trigger is present, backdoor persistence through retraining for another task, and state-of-the-art clean accuracy — the owner's evaluation cannot see the trigger.
    source: SRC-PAPER-042
    section_or_page: "arXiv 1708.06733 v2 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; the 25% average drop, persistence claim, and stop-sign use case are abstract-level statements"
    assumptions: "the abstract faithfully reports the experiments"
    counterevidence: >-
      none at this access level; later backdoor literature (unread this build) reports both stronger triggers and stronger defenses
    date: 2026-10-22

  - id: CLM-0064
    claim: >-
      Tramer et al. extracted models with near-perfect fidelity through prediction APIs alone — including logistic regression, neural networks, and decision trees, against BigML and Amazon Machine Learning — with extraction remaining possible when confidence values were withheld: model confidentiality is not a property of model quality.
    source: SRC-PAPER-043
    section_or_page: "arXiv 1609.02943 v2 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; near-perfect fidelity, the model classes, the services, and the no-confidence case are abstract-level statements"
    assumptions: "the abstract faithfully reports the experiments; 'near-perfect fidelity' at the abstract's own qualifier"
    counterevidence: >-
      none at this access level; modern APIs with hard rate limits and output rounding raise extraction cost (unread this build)
    date: 2026-10-22

  - id: CLM-0065
    claim: >-
      Shokri et al. showed membership inference against commercial machine-learning-as-a-service models (Google and Amazon named on the abstract) by training inference models to recognize differences in the target's predictions on trained versus untrained records, with a hospital-discharge dataset as the sensitive-membership motivation — overfitting leaks training membership through the API.
    source: SRC-PAPER-041
    section_or_page: "arXiv 1610.05820 v2 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; the mechanism, the commercial targets, and the hospital-discharge motivation are abstract-level statements"
    assumptions: "the abstract faithfully reports the evaluation; per-dataset accuracies (unread body) are not cited"
    counterevidence: >-
      none at this access level; the abstract itself frames results as vulnerability ('can be vulnerable'), not universal success
    date: 2026-10-22

  - id: CLM-0066
    claim: >-
      Szegedy et al.'s founding observation: an imperceptible perturbation causes misclassification, and the same perturbation transfers to a different network trained on a different subset of the dataset — adversarial examples are a property of the objective's off-sample geometry, not of one model's quirks.
    source: SRC-PAPER-040
    section_or_page: "arXiv 1312.6199 v4 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; imperceptibility and cross-network transfer are abstract-level statements without numeric rates"
    assumptions: "the abstract faithfully reports the observations"
    counterevidence: >-
      none at this access level; the linear explanation (Goodfellow et al., SRC-PAPER-046) later reframed the cause without contradicting the observation
    date: 2026-10-22
  - id: CLM-0067
    claim: >-
      Indirect prompt injection enables remote exploitation of LLM-integrated applications by strategically injecting prompts into data likely to be retrieved, demonstrated against real-world systems including Bing's GPT-4-powered Chat and code-completion engines, with an impact taxonomy including data theft, worming, and information-ecosystem contamination.
    source: SRC-PAPER-050
    section_or_page: "arXiv 2302.12173 v2 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; all named systems and taxonomy classes are abstract-level statements"
    assumptions: "the abstract faithfully reports the demonstrations"
    counterevidence: >-
      none at this access level; the demonstrations date to the 2023 application generation and specific integrations have since changed
    date: 2026-10-22

  - id: CLM-0068
    claim: >-
      Goal hijacking and prompt leaking are direct-injection attack classes demonstrated against production GPT-3 with simple handcrafted inputs — the application's intent and the user's content share one channel, and the model's compliance is attackable text all the way down.
    source: SRC-PAPER-051
    section_or_page: "arXiv 2211.09527 v1 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; both attack classes are named in the abstract without per-attack rates"
    assumptions: "the abstract faithfully reports the attack classes"
    counterevidence: >-
      none at this access level
    date: 2026-10-22

  - id: CLM-0069
    claim: >-
      An instruction hierarchy trained into GPT-3.5 via generated priority-conflict data significantly increases robustness against prompt injections and jailbreaks, including attack types not seen during training, with minimal degradation of standard capabilities — a training-time prior over channels, explicitly framed as robustness rather than prevention.
    source: SRC-PAPER-052
    section_or_page: "arXiv 2404.13208 v1 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; the robustness-including-unseen and minimal-degradation claims are abstract-level"
    assumptions: "the abstract faithfully reports the evaluation; 'significantly' and 'minimal' at the authors' qualifiers"
    counterevidence: >-
      optimized-suffix pressure (SRC-PAPER-004) is the adaptive condition the abstract does not claim to have survived at arbitrary budget
    date: 2026-10-22

  - id: CLM-0070
    claim: >-
      Spotlighting — transformations of untrusted input that provide a reliable continuous provenance signal — reduces indirect-injection attack success from greater than 50% to below 2% on GPT-family models with minimal task-efficacy impact: the channel becomes marked by form rather than by instruction.
    source: SRC-PAPER-053
    section_or_page: "arXiv 2403.14720 v1 abstract (fetched 2026-10-22)"
    evidence_strength: "abstract-read; both rate figures are abstract-level statements over the paper's attack set"
    assumptions: "the abstract faithfully reports the experiments; 'below 2%' is bounded, not proven — the chapter prices it as [0.6%, 7.0%] at n=100"
    counterevidence: >-
      optimized adaptive attackers and non-retrieval channels are outside the claim's measured scope (the chapter's section 4 and exercise 13.2 discipline)
    date: 2026-10-22

  - id: CLM-0071
    claim: >-
      The owner-selected video "Become AI Researcher From Scratch - Full Course" (Vuk Rosić, published 2025-11-18, approximately 3 hours from the first chapter to a final chapter starting at 2:56:59, 113,364 views and 6.9K likes at fetch time) is published under a Creative Commons Attribution license (reuse allowed) and teaches the from-scratch researcher path — AI math, PyTorch tensor operations, neural networks, and transformer/GPT construction — in 24 listed chapters from Course Introduction through Building the GPT.
    source: SRC-VIDEO-001
    section_or_page: "YouTube watch page for 44l-xL7OKLo (fetched 2026-10-22)"
    evidence_strength: "page-inspected; title, channel, counts, license, upload date, and chapter list read from the page; the spoken transcript was not retrieved"
    assumptions: "the page metadata (chapter titles, license badge, counts) reflects the video as published"
    counterevidence: >-
      none available at page level; view and like counts change over time and are dated to the fetch
    date: 2026-10-22

  - id: CLM-0072
    claim: >-
      The video's companion repository structures the same journey as 12 modules (start here; Python fundamentals; math; PyTorch fundamentals; neuron from scratch; activation functions; neural network from scratch; attention mechanism; transformer feedforward with Mixture-of-Experts; building a transformer with RoPE; DeepSeek latent attention; GLM-4 MoE) and tops it with a research-methodology layer of three experiments — a 5-variant ablation study at 512 hidden dimensions evaluated on HellaSwag, a learning-rate search, and an expert-configuration search — teaching hypothesis formation, controlled experiments, ablations, and baseline comparisons as skills.
    source: SRC-REPO-001
    section_or_page: "README.md and _course/ tree of vukrosic/zero-to-ai-researcher (cloned and read 2026-10-22)"
    evidence_strength: "full-text-read of the course markdown tree and README; experiment code inventoried, not executed"
    assumptions: "the README's curriculum and methodology description matches the committed course files (checked by reading the tree)"
    counterevidence: >-
      the repository's own README marks the YouTube course as 'coming soon' relative to the repo state, so video and repository may lag each other in coverage — the course tracks the union and cites each element to its own source
    date: 2026-10-22

  - id: CLM-0073
    claim: >-
      The companion repository's research paper (Blueberry LLM) reports, at abstract level: an 8.7x validation-performance gap between the best and worst of five ablation configurations; 3e-3 as the identified optimal learning rate for DeepSeek-attention+MLP (0.015 validation loss, 99.7% accuracy as stated); and 4 experts with top-2 routing as the best DeepSeek-attention+GLM-4-MoE configuration (0.061 validation loss, 98.7% accuracy as stated) on consumer-GPU training positioned at under one dollar.
    source: SRC-REPO-001
    section_or_page: "ai_research_paper.md, title/abstract/introduction (read at head level, cloned 2026-10-22)"
    evidence_strength: "abstract-level statements from the paper head; experiment sections, figures, and training logs not read; nothing reproduced or re-verified by this course"
    assumptions: "the paper's abstract faithfully reports its experiments; the numbers are the authors' self-reported results on their own setup"
    counterevidence: >-
      self-reported single-setup results with no independent replication located; 'under one dollar' positioning is a hardware-cost framing, not an audited cost — the course carries these numbers as the source's claims, priced accordingly in 06-advanced-architectures.md
    date: 2026-10-22

  - id: CLM-0074
    claim: >-
      CaMeL (Google DeepMind, arXiv:2503.18813) proposes a defense layer around LLM agents that extracts control and data flows from the trusted query so that untrusted data retrieved by the LLM cannot impact program flow, and uses capabilities to prevent exfiltration of private data over unauthorized flows by enforcing security policies at tool calls; on AgentDojo it solves 77% of tasks with provable security compared to 84% for an undefended system.
    source: SRC-PAPER-054
    section_or_page: "arXiv abstract page for 2503.18813 v2 (fetched 2026-10-22)"
    evidence_strength: "abstract-read; the 77%/84% figures are the authors' abstract-level statements, not re-verified here"
    assumptions: "the AgentDojo evaluation in the paper's body matches the abstract's summary; the term 'provable security' refers to an architectural property of the policy-enforced flows as described"
    counterevidence: >-
      chapter 14's own pricing (sections 4.4): at the assumed denominator of 97 tasks the two utility intervals overlap ([68.0, 84.5]% vs [74.9, 89.6]%), so the 7-point utility cost is not statistically resolved from zero at benchmark scale; the exact solved-task counts are body-level details not read
    date: 2026-10-22

  - id: CLM-0075
    claim: >-
      AgentDojo (NeurIPS 2024 Datasets and Benchmarks Track) is a dynamic evaluation environment for LLM agents that execute tools over untrusted data, populated with 97 realistic tasks and 629 security test cases, whose findings include that state-of-the-art LLMs fail many tasks even in the absence of attacks and that existing prompt-injection attacks break some security properties but not all.
    source: SRC-PAPER-055
    section_or_page: "arXiv abstract page for 2406.13352 v3 and the NeurIPS 2024 poster page (fetched 2026-10-22)"
    evidence_strength: "abstract-read; environment facts (97/629) and headline findings quoted at abstract level"
    assumptions: "the benchmark's task suites are as described in the abstract; findings are about the benchmark's attack suite, not about deployed systems"
    counterevidence: >-
      none at abstract level; the chapter prices these as benchmark-shaped evidence — deployment incidence is not measured by this source, and the per-model failure rates live in the unread body
    date: 2026-10-22

  - id: CLM-0076
    claim: >-
      ToolEmu (arXiv:2309.15817) uses an LM to emulate tool execution for scalable agent-risk testing with an LM-based safety evaluator over trajectories; 68.8% of failures identified with ToolEmu were judged (in its human evaluation) to be valid real-world agent failures; its curated initial benchmark has 36 high-stakes tools and 144 test cases; and even the safest LM agent it evaluated exhibited severe failures 23.9% of the time according to its evaluator.
    source: SRC-PAPER-056
    section_or_page: "arXiv abstract page for 2309.15817 v2 (fetched 2026-10-22)"
    evidence_strength: "abstract-read; all three numbers are the authors' abstract-level statements"
    assumptions: "the 23.9% is evaluator-judged over the 144-case benchmark (denominator assumed for interval pricing, stated as assumed in the chapter); the 68.8% is a validity rate over emulator-identified failures whose own denominator is not stated in the abstract"
    counterevidence: >-
      the two rates must not be multiplied into a deployed-incidence headline — the 68.8% validates the emulator, the 23.9% measures benchmark behavior; neither is a field rate, and the chapter's exercise 14.2 makes that refusal a rubric item
    date: 2026-10-22

  - id: CLM-0077
    claim: >-
      The capability model — reasoning about which computations may name which objects via unforgeable references that jointly name an object and rights over it — originates with Dennis and Van Horn, "Programming Semantics for Multiprogrammed Computations", Communications of the ACM, March 1966.
    source: SRC-PAPER-057
    section_or_page: "CACM archive research page for the March 1966 issue (fetched 2026-10-22)"
    evidence_strength: "metadata-only (title, authors, date, and the capability-model characterization read from the archive's summary); the 1966 full text was not fetched"
    assumptions: "the archive's characterization of the paper's contribution reflects the paper"
    counterevidence: >-
      none; a historical lineage claim with no quantitative content, cited for vocabulary origin only
    date: 2026-10-22

  - id: CLM-0078
    claim: >-
      The Model Context Protocol specification (2025-06-18 snapshot) defines an open JSON-RPC 2.0 protocol between hosts, clients, and servers (server features: resources, prompts, tools; client features: sampling, roots, elicitation) whose own security principles require explicit user consent and state that tools represent arbitrary code execution that must be treated with appropriate caution, that descriptions of tool behavior such as annotations should be considered untrusted unless obtained from a trusted server, and that MCP itself cannot enforce these security principles at the protocol level — leaving enforcement to host implementors.
    source: SRC-REPORT-005
    section_or_page: "Specification overview and Security and Trust & Safety section of the 2025-06-18 spec page (fetched 2026-10-22)"
    evidence_strength: "page-inspected; the quoted principle sentences and the enforcement caveat read from the specification page itself"
    assumptions: "the 2025-06-18 snapshot is the version described; later spec versions may revise these principles"
    counterevidence: >-
      none at page level; the chapter notes the tension between the consent principle (users must understand tools they authorize) and the tool-poisoning finding that users cannot see full descriptions (SRC-REPORT-006)
    date: 2026-10-22

  - id: CLM-0079
    claim: >-
      Invariant Labs demonstrated a "tool poisoning attack" against an MCP client (Cursor): a tool with the benign visible signature add(a, b, sidenote) whose description embeds a hidden instruction block directing the model to read ~/.cursor/mcp.json and ~/.ssh/id_rsa and pass their contents through the sidenote parameter, concealing the action from the user; the post states three enabling conditions (no user visibility into full tool descriptions; models trained to follow instructions precisely; malicious behavior concealed behind legitimate functionality).
    source: SRC-REPORT-006
    section_or_page: "Invariant Labs blog post (fetched 2026-10-22), including the demonstrated tool source block"
    evidence_strength: "page-inspected; a vendor demonstration with the attack code shown, not a peer-reviewed measurement — no success-rate denominator stated on the page"
    assumptions: "the demonstration ran as described against the client version current at post time"
    counterevidence: >-
      vendor demonstration of a mechanism, not a prevalence measurement; post date not displayed on the fetched page, and client hardening since the demonstration is untracked here — the chapter carries it as a mechanism demonstration only
    date: 2026-10-22

  - id: CLM-0080
    claim: >-
      Simon Willison's prompt-injection analysis frames the structural root as trusted and untrusted text concatenated into the same token stream with no known reliable way for an LLM to follow instructions in one category while safely applying them to another; his Dual LLM pattern (April 2023) separates a privileged tool-holding model from a quarantined tool-less model, and the DeepMind CaMeL paper (as quoted by Willison) identifies the pattern's residual flaw — the quarantined model still influences arguments of the privileged model's tool calls, so an attacker who cannot choose which tool is called can still modify its arguments (a data-flow attack on a control-flow defense).
    source: SRC-REPORT-007
    section_or_page: "simonwillison.net post of 2025-04-11 (fetched 2026-10-22), including quoted passages from the CaMeL paper"
    evidence_strength: "page-inspected; the Dual-LLM flaw characterization is a quote of the DeepMind paper as rendered in the blog (secondhand for the paper's wording; the paper itself is carried at SRC-PAPER-054 abstract-read)"
    assumptions: "the quoted passages faithfully reproduce the CaMeL paper's description of the Dual LLM pattern and its limits"
    counterevidence: >-
      commentary, not measurement; the post's positive assessment of CaMeL is the author's opinion and is not carried as evidence by the chapter — only the lineage, the framing, and the quoted flaw analysis are
    date: 2026-10-22

  - id: CLM-0081
    claim: >-
      The Anthropic red-teaming effort of Ganguli et al. (arXiv:2209.07858) describes red teaming as simultaneously discovering, measuring, and attempting to reduce harmful outputs; released a dataset of 38,961 red team attacks; and found across 3 model sizes and 4 model types that RLHF models are increasingly difficult to red team as they scale while the other model types show a flat trend with scale.
    source: SRC-PAPER-058
    section_or_page: "arXiv abstract page for 2209.07858 v2 (fetched 2026-10-22)"
    evidence_strength: "abstract-read; all figures are the authors' abstract-level statements"
    assumptions: "the released attack dataset is as described; the scaling trend refers to the evaluated model families at the evaluated scales"
    counterevidence: >-
      none at abstract level; the trend is a property of the 2022-era evaluated models, and chapter 15 prices it as a dated finding, not a law
    date: 2026-10-22

  - id: CLM-0082
    claim: >-
      Perez et al. (arXiv:2202.03286) demonstrate automated red teaming in which one language model generates test cases against a target language model, using methods from zero-shot generation to reinforcement learning, uncovering tens of thousands of offensive replies in a 280B-parameter chatbot and, via prompt engineering, specific harm classes including offensive discussion of groups, leaked contact information, training-data leakage, and conversation-emergent harms.
    source: SRC-PAPER-059
    section_or_page: "arXiv abstract page for 2202.03286 (fetched 2026-10-22)"
    evidence_strength: "abstract-read; the paper's own scoping ('one promising tool (among many needed)') is carried intact"
    assumptions: "the offensive-reply counts are as stated at the evaluated target scale"
    counterevidence: >-
      none at abstract level; chapter 15's oracle-problem analysis adds the structural caveat the paper implies — the harms found are bounded by the generator's imagination and the classifier's coverage
    date: 2026-10-22

  - id: CLM-0083
    claim: >-
      Casper et al. (arXiv:2306.09442) propose red teaming from scratch in three steps — exploring the model's behavior range, establishing a definition and measurement of undesired behavior, and exploiting flaws with that measure — arguing that pre-existing classifiers prevent tailored red teaming and that when failures can be easily classified in advance red teaming has limited marginal value; they demonstrate the framework on GPT-3, discovering input classes that elicit false statements and constructing the 20,000-statement CommonClaim dataset.
    source: SRC-PAPER-060
    section_or_page: "arXiv abstract page for 2306.09442 v3 (fetched 2026-10-22)"
    evidence_strength: "abstract-read; framework and demonstration figures as stated by the authors"
    assumptions: "CommonClaim's 20,000 statements are as described in the unread body"
    counterevidence: >-
      none at abstract level; the marginal-value argument is the authors' position on scoping, which chapter 15 uses to define the oracle problem rather than as a license to skip red teaming
    date: 2026-10-22

  - id: CLM-0084
    claim: >-
      XSTest (Röttger et al., arXiv:2308.01263 v3, NAACL 2024) comprises 250 safe prompts across ten prompt types that well-calibrated models should not refuse plus 200 unsafe prompts as contrasts, built to identify exaggerated safety behaviours in which clearly safe prompts are refused because they use similar language to unsafe prompts or mention sensitive topics.
    source: SRC-PAPER-061
    section_or_page: "arXiv abstract page for 2308.01263 v3 (fetched 2026-10-22)"
    evidence_strength: "abstract-read; the 250/200 composition is the v3 abstract's statement"
    assumptions: "the ten-type breakdown and per-model refusal rates live in the unread body and are not carried as claims"
    counterevidence: >-
      an earlier public summary page describes 200 safe prompts; the v3 abstract (250 safe) is the version carried, and the discrepancy is recorded here rather than silently resolved
    date: 2026-10-22
