# Claims register — claim-level evidence tracking.
#
# Each entry: id, claim, source (source-register ID), section_or_page,
# evidence_strength, assumptions, counterevidence, date.
#
# Purpose: keep every substantive claim in this repository falsifiable and
# traceable. Conjecture stays out of authoritative prose unless labeled.

claims:
  - id: CLM-0001
    claim: >-
      The reference article "AI Safety: From First Principles to Practice" was
      accessible in full (introduction, sections 1-11, and both closing resource
      lists) without a paywall during an automated fetch on 2026-10-21.
    source: SRC-ARTICLE-001
    section_or_page: "full article (automated fetch)"
    evidence_strength: "direct observation, single fetch session"
    assumptions: "paywall status is session- and region-dependent; 'accessible' means the fetched HTML contained the listed sections"
    counterevidence: >-
      The project brief prepared on 2026-10-20 recorded full-text access to the
      same URL as blocked during preparation. Both observations are recorded; the
      discrepancy is unexplained and does not affect any technical claim.
    date: 2026-10-21

  - id: CLM-0002
    claim: >-
      ARENA's public curriculum page lists five chapters (0 Fundamentals,
      1 Transformer Interpretability, 2 Reinforcement Learning, 3 LLM Evaluations,
      4 Alignment Science) plus capstone projects, with PyTorch and Gym named as
      chapter-specific tools.
    source: SRC-CURR-001
    section_or_page: "curriculum landing page"
    evidence_strength: "direct page inspection, chapter titles visible"
    assumptions: "the landing page reflects the current curriculum structure"
    counterevidence: "unit-level structure and exercise banks were not inspected; internal organization may differ from the chapter listing"
    date: 2026-10-21

  - id: CLM-0003
    claim: >-
      BlueDot's Technical AI Safety course is free of charge, requires an
      application, runs in intensive (6-day) and part-time (6-week) formats, and
      states coverage of alignment/RLHF, mechanistic interpretability,
      evaluations and red-teaming, AI control, and scalable oversight.
    source: SRC-CURR-002
    section_or_page: "course landing page"
    evidence_strength: "direct page inspection of stated terms and coverage"
    assumptions: "the landing page reflects current course terms"
    counterevidence: "application deadlines shown on the page change over time; none recorded here"
    date: 2026-10-21

  - id: CLM-0004
    claim: "The awesome-ai-safety repository states CC0-1.0 as its license."
    source: SRC-LIST-002
    section_or_page: "repository README license section"
    evidence_strength: "direct page inspection of stated license"
    assumptions: "the stated license matches the repository's actual licensing intent"
    counterevidence: "license statements in READMEs are not always synchronized with LICENSE files; file-level check not yet performed"
    date: 2026-10-21

  - id: CLM-0005
    claim: >-
      Both inspected awesome-lists organize resources by topic category without
      per-entry difficulty or prerequisite metadata, whereas this repository's
      AWESOME.md plan annotates entries by supporting chapter, route, difficulty,
      and access conditions.
    source: SRC-LIST-001
    section_or_page: "README category listings (corroborated by SRC-LIST-002)"
    evidence_strength: "comparative page inspection of two indexes"
    assumptions: "the two inspected lists are representative of the genre; other indexes may annotate entries"
    counterevidence: "some indexes (not yet inspected) do annotate difficulty; this claim motivates a design choice, not a universal statement"
    date: 2026-10-21

  - id: CLM-0006
    claim: >-
      The International AI Safety Report 2026 is the second edition of the
      report, was published on 2026-02-03, is downloadable in English and
      five other official UN languages, and is licensed under the Open
      Government Licence v3.0.
    source: SRC-REPORT-001
    section_or_page: "publication landing page"
    evidence_strength: "direct page inspection of stated edition, date, languages, and license"
    assumptions: "the landing page accurately reflects the published edition"
    counterevidence: "none at page level; full text not yet read, so content-level claims are not yet made"
    date: 2026-10-21

  - id: CLM-0007
    claim: >-
      Concrete Problems in AI Safety (Amodei et al., 2016, arXiv:1606.06565,
      v2) defines AI accidents as unintended and harmful behavior emerging
      from poor design of real-world ML systems, and organizes five practical
      research problems - avoiding side effects, avoiding reward hacking,
      scalable supervision, safe exploration, and distributional shift - by
      whether they originate from a wrong objective function, an
      expensive-to-evaluate objective, or undesirable behavior during
      learning.
    source: SRC-PAPER-001
    section_or_page: "abstract (verified verbatim from the arXiv abstract page)"
    evidence_strength: "direct abstract read"
    assumptions: "the abstract accurately represents the paper's taxonomy"
    counterevidence: "none from the abstract itself; section-level nuance requires full-text reading, which is assigned as chapter reading and not yet performed by the course author"
    date: 2026-10-21

  - id: CLM-0008
    claim: >-
      Risks from Learned Optimization (Hubinger et al., arXiv:1906.01820,
      v3) introduces the term mesa-optimization for a learned model that is
      itself an optimizer, and poses two questions: under what circumstances
      learned models will be optimizers (including when they should not
      be), and, when a learned model is an optimizer, what its objective
      will be and how it can differ from the training loss.
    source: SRC-PAPER-002
    section_or_page: "abstract (verified verbatim from the arXiv abstract page)"
    evidence_strength: "direct abstract read"
    assumptions: "the abstract accurately represents the paper's core definitions"
    counterevidence: "none from the abstract itself; the paper's internal distinctions (e.g., inner vs outer alignment) await full-text reading before chapter 07 relies on them"
    date: 2026-10-21

  # --- Dataset-catalog verification round, 2026-10-21 ---
  # One claim per catalog dataset for its headline verified facts. Per-fact
  # provenance is in datasets/cards/*.md reference tables.

  - id: CLM-0009
    claim: >-
      On 2026-10-21, the canonical Hugging Face page for TruthfulQA
      displayed license apache-2.0, a validation split of 817 rows, task
      tags including multiple choice / text generation / question answering,
      and adversarial subcategories including Misconceptions, Proverbs,
      Misquotations, Conspiracies, and Superstitions.
    source: SRC-DATASET-001
    section_or_page: "dataset landing page and data viewer"
    evidence_strength: "direct page inspection, single session"
    assumptions: "hosted page reflects the dataset's current canonical form"
    counterevidence: "row counts on hosted pages are living properties; re-verification required before quantitative use"
    date: 2026-10-21

  - id: CLM-0010
    claim: >-
      On 2026-10-21, the AmazonScience/bold Hugging Face page displayed the
      BOLD license as Creative Commons Attribution Share Alike 4.0
      International, stated 23,679 text generation prompts, and enumerated
      five domains with sub-group and prompt counts: Profession 18/10,195;
      Gender 2/3,204; Race 4/7,657; Religious ideologies 7/639; Political
      ideologies 12/1,984.
    source: SRC-DATASET-002
    section_or_page: "dataset card body"
    evidence_strength: "direct page inspection, single session"
    assumptions: "the page's per-domain enumeration is internally consistent with the shipped data"
    counterevidence: "paper-level construction details (Wikipedia sourcing) unverified; domain sum 23,679 matches the total as displayed"
    date: 2026-10-21

  - id: CLM-0011
    claim: >-
      On 2026-10-21, the allenai/real-toxicity-prompts Hugging Face page
      displayed license apache-2.0, 99.4k rows in the default subset, and
      toxicity-score fields across eight subcategories (threat, insult,
      severe_toxicity, toxicity, profanity, sexually_explicit,
      identity_attack, flirtation).
    source: SRC-DATASET-003
    section_or_page: "dataset landing page and data viewer"
    evidence_strength: "direct page inspection, single session"
    assumptions: "field names on the viewer reflect the shipped schema"
    counterevidence: "scoring-backend provenance (which classifier produced the scores) is paper-level and unverified here"
    date: 2026-10-21

  - id: CLM-0012
    claim: >-
      On 2026-10-21, the skg/toxigen-data Hugging Face page displayed an
      overall size bucket of 100K-1M rows, an annotated subset of 9.9k rows
      (train 8.96k, test 940), a prompts split of 31k rows and an
      annotations split of 27.5k rows, and NO visible license.
    source: SRC-DATASET-004
    section_or_page: "dataset landing page and splits view"
    evidence_strength: "direct page inspection, single session"
    assumptions: "the absence of a displayed license is itself the observation"
    counterevidence: "the upstream repository may carry a license not surfaced on the HF page; recorded as pending, not as 'unlicensed'"
    date: 2026-10-21

  - id: CLM-0013
    claim: >-
      On 2026-10-21, two independent Hugging Face mirrors of BBQ (heegyu/bbq
      and walledai/BBQ) both displayed 58,492 rows; the HiTZ/bbq mirror
      displayed the 9-category ambig/disambiguation configuration structure
      with 3 answer options per item, 4-shot train splits, and no train split
      for the Religion category; the paper is published in Findings of ACL
      2022 (2022.findings-acl.165, pages 2086-2105) by Parrish et al.
    source: SRC-DATASET-005
    section_or_page: "three mirror pages (heegyu, HiTZ, walledai)"
    evidence_strength: "cross-corroborated page inspection (two independent mirrors agreeing on row count)"
    assumptions: "mirrors faithfully reflect the canonical dataset structure"
    counterevidence: "canonical GitHub repository and its license were not directly inspected this round"
    date: 2026-10-21

  - id: CLM-0014
    claim: >-
      XSTest comprises 250 safe prompts across ten prompt types and 200
      unsafe contrast prompts; its prompts are CC BY 4.0 licensed (model
      completions remain under original Meta/Mistral/OpenAI licenses); it
      was accepted at NAACL 2024 main; the arXiv abstract page records
      v1 2023-08-02 and v3 2024-04-01.
    source: SRC-DATASET-006
    section_or_page: "GitHub README license section; arXiv 2308.01263 abstract page (corroborated by walledai/XSTest)"
    evidence_strength: "direct page inspection + abstract read, two-source agreement on composition"
    assumptions: "repository license statement matches shipped files"
    counterevidence: "none at page level; per-prompt-type rubric details pending full-text read"
    date: 2026-10-21

  - id: CLM-0015
    claim: >-
      On 2026-10-21, the PKU-Alignment/BeaverTails Hugging Face page
      displayed license cc-by-nc-4.0 (non-commercial), 364k rows in the
      default subset, four split configurations (330k_train 301k rows;
      330k_test 33.4k; 30k_train 27.2k; 30k_test 3.02k), and a
      safety-dimension taxonomy beginning with animal abuse, child abuse,
      controversial topics/politics, discrimination/stereotype/injustice,
      drug abuse/weapons/banned substance, financial crime/property
      crime/theft, hate speech/offensive language, and misinformation
      regarding ethics/laws (list truncated in fetch).
    source: SRC-DATASET-007
    section_or_page: "dataset landing page and splits view"
    evidence_strength: "direct page inspection, single session"
    assumptions: "the taxonomy list as displayed is a prefix of the full dimension set"
    counterevidence: "truncation means the count of dimensions is recorded as 'at least eight groups', not the commonly quoted 14"
    date: 2026-10-21

  - id: CLM-0016
    claim: >-
      On 2026-10-21, the Anthropic/hh-rlhf Hugging Face page displayed
      license MIT, 169k total rows with train 161k and test 8.55k, and a
      page update marker of May 2023; the fetched view showed only a default
      aggregate subset without the well-known subset names.
    source: SRC-DATASET-008
    section_or_page: "dataset landing page and data viewer"
    evidence_strength: "direct page inspection, single session"
    assumptions: "the aggregate default view reflects the full corpus row count"
    counterevidence: "subset structure (helpful-base, harmless-base, red-team) was NOT displayed and is deliberately recorded as unverified"
    date: 2026-10-21

  - id: CLM-0017
    claim: >-
      The canonical AdvBench file (data/advbench/harmful_behaviors.csv in the
      llm-attacks repository, commit a62d130, 2023-07-27) has 521 lines —
      520 data rows plus a header — with columns goal and target; the
      walledai/AdvBench mirror card instead describes 'a set of 500 harmful
      behaviors' and omits harmful_strings.csv. Both numbers are recorded
      with their provenance; the discrepancy is documented, not resolved.
    source: SRC-DATASET-009
    section_or_page: "GitHub file view of harmful_behaviors.csv; corroborated by mirror card (SRC-DATASET-009b)"
    evidence_strength: "direct file-view inspection (line count displayed by GitHub) + mirror card comparison"
    assumptions: "GitHub's displayed line count equals the file's row count"
    counterevidence: "the mirror's 500 framing may describe the paper's experiment subset rather than the file's contents; resolving this requires the full-text read"
    date: 2026-10-21

  - id: CLM-0018
    claim: >-
      On 2026-10-21, the JailbreakBench/JBB-Behaviors Hugging Face page
      displayed MIT license verbatim ('This dataset, like the code, is
      released under MIT License.'), a behaviors subset of 200 rows split
      into 100 harmful and 100 benign behaviors, a judge_comparison subset
      of 300 rows, ten behavior categories aligned with OpenAI usage
      policies, a Source field with three values (TDC/HarmBench, AdvBench,
      Original), and DOI 10.57967/hf/2540.
    source: SRC-DATASET-010
    section_or_page: "dataset landing page and data viewer"
    evidence_strength: "direct page inspection including field-level schema, single session"
    assumptions: "page metadata reflects the current published artifact"
    counterevidence: "the judge protocol and leaderboard methodology are paper-level and unverified"
    date: 2026-10-21

  - id: CLM-0019
    claim: >-
      The HarmBench abstract (arXiv:2402.04249, v2 2024-02-27, 12 authors
      led by Mantas Mazeika) describes a standardized evaluation framework
      for automated red teaming, reporting a large-scale comparison of 18
      red teaming methods and 33 target LLMs and defenses, and introducing
      an adversarial training method that improves robustness.
    source: SRC-PAPER-005
    section_or_page: "arXiv abstract page"
    evidence_strength: "direct abstract read"
    assumptions: "the abstract accurately represents the paper's scope"
    counterevidence: "behavior-set sizes are not stated in the abstract and were not verified by other means — any composition claims beyond this are withheld"
    date: 2026-10-21

  - id: CLM-0020
    claim: >-
      WildChat exists in at least three public Hugging Face releases —
      650K conversations (allenai/WildChat), 1M conversations
      (allenai/WildChat-1M), and 3,199,860 conversations in the
      non-toxic-only 4.8M-branded release (allenai/WildChat-4.8M, dated
      2025-08-11); the 1M release's license was changed to ODC-BY on
      2024-06-26 with retroactive effect, per the page's own change note
      and README commit reference.
    source: SRC-DATASET-012
    section_or_page: "three release pages (corroborated by SRC-DATASET-011 and SRC-DATASET-013)"
    evidence_strength: "multi-page direct inspection including a dated license-change note"
    assumptions: "the page's license-change note accurately describes the licensing history"
    counterevidence: "the 4.8M branding vs 3,199,860 count discrepancy is recorded verbatim; 'retroactive' is the releaser's policy statement"
    date: 2026-10-21

  - id: CLM-0021
    claim: >-
      SafetyBench comprises 11,435 multiple-choice questions across 7
      categories of safety concerns in both Chinese and English; the paper
      (Zhang et al.) is published at ACL 2024 (2024.acl-long.830).
    source: SRC-DATASET-014
    section_or_page: "GitHub repository README; corroborated by ACL Anthology listing (SRC-DATASET-015)"
    evidence_strength: "two-source page inspection (repository + anthology)"
    assumptions: "repository README composition statement matches shipped data"
    counterevidence: "the seven category names, license, and split structure were not enumerated in the fetched views and are recorded as pending"
    date: 2026-10-21
