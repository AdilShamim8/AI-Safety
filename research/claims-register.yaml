    date: 2026-10-21
  - id: CLM-0033
    claim: >-
      The weak-to-strong abstract states that techniques like RLHF may scale poorly to superhuman models without dedicated work — humans will eventually only weakly supervise systems more capable than they are.
    source: SRC-PAPER-013
    section_or_page: "arXiv abstract page (fetched 2026-10-21)"
