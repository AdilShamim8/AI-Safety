claims:
- id: CLM-0001
  claim: 'The reference article "AI Safety: From First Principles to Practice" was accessible in full
    (introduction, sections 1-11, and both closing resource lists) without a paywall during an automated
    fetch on 2026-10-21.'
  source: SRC-ARTICLE-001
  section_or_page: full article (automated fetch)
  evidence_strength: direct observation, single fetch session
  assumptions: paywall status is session- and region-dependent; 'accessible' means the fetched HTML contained
    the listed sections
  counterevidence: The project brief prepared on 2026-10-20 recorded full-text access to the same URL
    as blocked during preparation. Both observations are recorded; the discrepancy is unexplained and
    does not affect any technical claim.
  date: 2026-10-21
- id: CLM-0002
  claim: ARENA's public curriculum page lists five chapters (0 Fundamentals, 1 Transformer Interpretability,
    2 Reinforcement Learning, 3 LLM Evaluations, 4 Alignment Science) plus capstone projects, with PyTorch
    and Gym named as chapter-specific tools.
  source: SRC-CURR-001
  section_or_page: curriculum landing page
  evidence_strength: direct page inspection, chapter titles visible
  assumptions: the landing page reflects the current curriculum structure
  counterevidence: unit-level structure and exercise banks were not inspected; internal organization may
    differ from the chapter listing
  date: 2026-10-21
- id: CLM-0003
  claim: BlueDot's Technical AI Safety course is free of charge, requires an application, runs in intensive
    (6-day) and part-time (6-week) formats, and states coverage of alignment/RLHF, mechanistic interpretability,
    evaluations and red-teaming, AI control, and scalable oversight.
  source: SRC-CURR-002
  section_or_page: course landing page
  evidence_strength: direct page inspection of stated terms and coverage
  assumptions: the landing page reflects current course terms
  counterevidence: application deadlines shown on the page change over time; none recorded here
  date: 2026-10-21
- id: CLM-0004
  claim: The awesome-ai-safety repository states CC0-1.0 as its license.
  source: SRC-LIST-002
  section_or_page: repository README license section
  evidence_strength: direct page inspection of stated license
  assumptions: the stated license matches the repository's actual licensing intent
  counterevidence: license statements in READMEs are not always synchronized with LICENSE files; file-level
    check not yet performed
  date: 2026-10-21
- id: CLM-0005
  claim: Both inspected awesome-lists organize resources by topic category without per-entry difficulty
    or prerequisite metadata, whereas this repository's AWESOME.md plan annotates entries by supporting
    chapter, route, difficulty, and access conditions.
  source: SRC-LIST-001
  section_or_page: README category listings (corroborated by SRC-LIST-002)
  evidence_strength: comparative page inspection of two indexes
  assumptions: the two inspected lists are representative of the genre; other indexes may annotate entries
  counterevidence: some indexes (not yet inspected) do annotate difficulty; this claim motivates a design
    choice, not a universal statement
  date: 2026-10-21
- id: CLM-0006
  claim: The International AI Safety Report 2026 is the second edition of the report, was published on
    2026-02-03, is downloadable in English and five other official UN languages, and is licensed under
    the Open Government Licence v3.0.
  source: SRC-REPORT-001
  section_or_page: publication landing page
  evidence_strength: direct page inspection of stated edition, date, languages, and license
  assumptions: the landing page accurately reflects the published edition
  counterevidence: none at page level; full text not yet read, so content-level claims are not yet made
  date: 2026-10-21
- id: CLM-0007
  claim: Concrete Problems in AI Safety (Amodei et al., 2016, arXiv:1606.06565, v2) defines AI accidents
    as unintended and harmful behavior emerging from poor design of real-world ML systems, and organizes
    five practical research problems - avoiding side effects, avoiding reward hacking, scalable supervision,
    safe exploration, and distributional shift - by whether they originate from a wrong objective function,
    an expensive-to-evaluate objective, or undesirable behavior during learning.
  source: SRC-PAPER-001
  section_or_page: abstract (verified verbatim from the arXiv abstract page)
  evidence_strength: direct abstract read
  assumptions: the abstract accurately represents the paper's taxonomy
  counterevidence: none from the abstract itself; section-level nuance requires full-text reading, which
    is assigned as chapter reading and not yet performed by the course author
  date: 2026-10-21
- id: CLM-0008
  claim: 'Risks from Learned Optimization (Hubinger et al., arXiv:1906.01820, v3) introduces the term
    mesa-optimization for a learned model that is itself an optimizer, and poses two questions: under
    what circumstances learned models will be optimizers (including when they should not be), and, when
    a learned model is an optimizer, what its objective will be and how it can differ from the training
    loss.'
  source: SRC-PAPER-002
  section_or_page: abstract (verified verbatim from the arXiv abstract page)
  evidence_strength: direct abstract read
  assumptions: the abstract accurately represents the paper's core definitions
  counterevidence: none from the abstract itself; the paper's internal distinctions (e.g., inner vs outer
    alignment) await full-text reading before chapter 07 relies on them
  date: 2026-10-21
- id: CLM-0009
  claim: On 2026-10-21, the canonical Hugging Face page for TruthfulQA displayed license apache-2.0, a
    validation split of 817 rows, task tags including multiple choice / text generation / question answering,
    and adversarial subcategories including Misconceptions, Proverbs, Misquotations, Conspiracies, and
    Superstitions.
  source: SRC-DATASET-001
  section_or_page: dataset landing page and data viewer
  evidence_strength: direct page inspection, single session
  assumptions: hosted page reflects the dataset's current canonical form
  counterevidence: row counts on hosted pages are living properties; re-verification required before quantitative
    use
  date: 2026-10-21
- id: CLM-0010
  claim: 'On 2026-10-21, the AmazonScience/bold Hugging Face page displayed the BOLD license as Creative
    Commons Attribution Share Alike 4.0 International, stated 23,679 text generation prompts, and enumerated
    five domains with sub-group and prompt counts: Profession 18/10,195; Gender 2/3,204; Race 4/7,657;
    Religious ideologies 7/639; Political ideologies 12/1,984.'
  source: SRC-DATASET-002
  section_or_page: dataset card body
  evidence_strength: direct page inspection, single session
  assumptions: the page's per-domain enumeration is internally consistent with the shipped data
  counterevidence: paper-level construction details (Wikipedia sourcing) unverified; domain sum 23,679
    matches the total as displayed
  date: 2026-10-21
- id: CLM-0011
  claim: On 2026-10-21, the allenai/real-toxicity-prompts Hugging Face page displayed license apache-2.0,
    99.4k rows in the default subset, and toxicity-score fields across eight subcategories (threat, insult,
    severe_toxicity, toxicity, profanity, sexually_explicit, identity_attack, flirtation).
  source: SRC-DATASET-003
  section_or_page: dataset landing page and data viewer
  evidence_strength: direct page inspection, single session
  assumptions: field names on the viewer reflect the shipped schema
  counterevidence: scoring-backend provenance (which classifier produced the scores) is paper-level and
    unverified here
  date: 2026-10-21
- id: CLM-0012
  claim: On 2026-10-21, the skg/toxigen-data Hugging Face page displayed an overall size bucket of 100K-1M
    rows, an annotated subset of 9.9k rows (train 8.96k, test 940), a prompts split of 31k rows and an
    annotations split of 27.5k rows, and NO visible license.
  source: SRC-DATASET-004
  section_or_page: dataset landing page and splits view
  evidence_strength: direct page inspection, single session
  assumptions: the absence of a displayed license is itself the observation
  counterevidence: the upstream repository may carry a license not surfaced on the HF page; recorded as
    pending, not as 'unlicensed'
  date: 2026-10-21
- id: CLM-0013
  claim: On 2026-10-21, two independent Hugging Face mirrors of BBQ (heegyu/bbq and walledai/BBQ) both
    displayed 58,492 rows; the HiTZ/bbq mirror displayed the 9-category ambig/disambiguation configuration
    structure with 3 answer options per item, 4-shot train splits, and no train split for the Religion
    category; the paper is published in Findings of ACL 2022 (2022.findings-acl.165, pages 2086-2105)
    by Parrish et al.
  source: SRC-DATASET-005
  section_or_page: three mirror pages (heegyu, HiTZ, walledai)
  evidence_strength: cross-corroborated page inspection (two independent mirrors agreeing on row count)
  assumptions: mirrors faithfully reflect the canonical dataset structure
  counterevidence: canonical GitHub repository and its license were not directly inspected this round
  date: 2026-10-21
- id: CLM-0014
  claim: XSTest comprises 250 safe prompts across ten prompt types and 200 unsafe contrast prompts; its
    prompts are CC BY 4.0 licensed (model completions remain under original Meta/Mistral/OpenAI licenses);
    it was accepted at NAACL 2024 main; the arXiv abstract page records v1 2023-08-02 and v3 2024-04-01.
  source: SRC-DATASET-006
  section_or_page: GitHub README license section; arXiv 2308.01263 abstract page (corroborated by walledai/XSTest)
  evidence_strength: direct page inspection + abstract read, two-source agreement on composition
  assumptions: repository license statement matches shipped files
  counterevidence: none at page level; per-prompt-type rubric details pending full-text read
  date: 2026-10-21
- id: CLM-0015
  claim: On 2026-10-21, the PKU-Alignment/BeaverTails Hugging Face page displayed license cc-by-nc-4.0
    (non-commercial), 364k rows in the default subset, four split configurations (330k_train 301k rows;
    330k_test 33.4k; 30k_train 27.2k; 30k_test 3.02k), and a safety-dimension taxonomy beginning with
    animal abuse, child abuse, controversial topics/politics, discrimination/stereotype/injustice, drug
    abuse/weapons/banned substance, financial crime/property crime/theft, hate speech/offensive language,
    and misinformation regarding ethics/laws (list truncated in fetch).
  source: SRC-DATASET-007
  section_or_page: dataset landing page and splits view
  evidence_strength: direct page inspection, single session
  assumptions: the taxonomy list as displayed is a prefix of the full dimension set
  counterevidence: truncation means the count of dimensions is recorded as 'at least eight groups', not
    the commonly quoted 14
  date: 2026-10-21
- id: CLM-0016
  claim: On 2026-10-21, the Anthropic/hh-rlhf Hugging Face page displayed license MIT, 169k total rows
    with train 161k and test 8.55k, and a page update marker of May 2023; the fetched view showed only
    a default aggregate subset without the well-known subset names.
  source: SRC-DATASET-008
  section_or_page: dataset landing page and data viewer
  evidence_strength: direct page inspection, single session
  assumptions: the aggregate default view reflects the full corpus row count
  counterevidence: subset structure (helpful-base, harmless-base, red-team) was NOT displayed and is deliberately
    recorded as unverified
  date: 2026-10-21
- id: CLM-0017
  claim: The canonical AdvBench file (data/advbench/harmful_behaviors.csv in the llm-attacks repository,
    commit a62d130, 2023-07-27) has 521 lines — 520 data rows plus a header — with columns goal and target;
    the walledai/AdvBench mirror card instead describes 'a set of 500 harmful behaviors' and omits harmful_strings.csv.
    Both numbers are recorded with their provenance; the discrepancy is documented, not resolved.
  source: SRC-DATASET-009
  section_or_page: GitHub file view of harmful_behaviors.csv; corroborated by mirror card (SRC-DATASET-009b)
  evidence_strength: direct file-view inspection (line count displayed by GitHub) + mirror card comparison
  assumptions: GitHub's displayed line count equals the file's row count
  counterevidence: the mirror's 500 framing may describe the paper's experiment subset rather than the
    file's contents; resolving this requires the full-text read
  date: 2026-10-21
- id: CLM-0018
  claim: On 2026-10-21, the JailbreakBench/JBB-Behaviors Hugging Face page displayed MIT license verbatim
    ('This dataset, like the code, is released under MIT License.'), a behaviors subset of 200 rows split
    into 100 harmful and 100 benign behaviors, a judge_comparison subset of 300 rows, ten behavior categories
    aligned with OpenAI usage policies, a Source field with three values (TDC/HarmBench, AdvBench, Original),
    and DOI 10.57967/hf/2540.
  source: SRC-DATASET-010
  section_or_page: dataset landing page and data viewer
  evidence_strength: direct page inspection including field-level schema, single session
  assumptions: page metadata reflects the current published artifact
  counterevidence: the judge protocol and leaderboard methodology are paper-level and unverified
  date: 2026-10-21
- id: CLM-0019
  claim: The HarmBench abstract (arXiv:2402.04249, v2 2024-02-27, 12 authors led by Mantas Mazeika) describes
    a standardized evaluation framework for automated red teaming, reporting a large-scale comparison
    of 18 red teaming methods and 33 target LLMs and defenses, and introducing an adversarial training
    method that improves robustness.
  source: SRC-PAPER-005
  section_or_page: arXiv abstract page
  evidence_strength: direct abstract read
  assumptions: the abstract accurately represents the paper's scope
  counterevidence: behavior-set sizes are not stated in the abstract and were not verified by other means
    — any composition claims beyond this are withheld
  date: 2026-10-21
- id: CLM-0020
  claim: WildChat exists in at least three public Hugging Face releases — 650K conversations (allenai/WildChat),
    1M conversations (allenai/WildChat-1M), and 3,199,860 conversations in the non-toxic-only 4.8M-branded
    release (allenai/WildChat-4.8M, dated 2025-08-11); the 1M release's license was changed to ODC-BY
    on 2024-06-26 with retroactive effect, per the page's own change note and README commit reference.
  source: SRC-DATASET-012
  section_or_page: three release pages (corroborated by SRC-DATASET-011 and SRC-DATASET-013)
  evidence_strength: multi-page direct inspection including a dated license-change note
  assumptions: the page's license-change note accurately describes the licensing history
  counterevidence: the 4.8M branding vs 3,199,860 count discrepancy is recorded verbatim; 'retroactive'
    is the releaser's policy statement
  date: 2026-10-21
- id: CLM-0021
  claim: SafetyBench comprises 11,435 multiple-choice questions across 7 categories of safety concerns
    in both Chinese and English; the paper (Zhang et al.) is published at ACL 2024 (2024.acl-long.830).
  source: SRC-DATASET-014
  section_or_page: GitHub repository README; corroborated by ACL Anthology listing (SRC-DATASET-015)
  evidence_strength: two-source page inspection (repository + anthology)
  assumptions: repository README composition statement matches shipped data
  counterevidence: the seven category names, license, and split structure were not enumerated in the fetched
    views and are recorded as pending
  date: 2026-10-21
- id: CLM-0022
  claim: 'The Risks from Learned Optimization abstract (arXiv:1906.01820; v1 2019-06-05, v3 2021-12-01;
    Hubinger, van Merwijk, Mikulik, Skalse, Garrabrant) introduces the term mesa-optimization for learned
    models that are themselves optimizers and poses two safety questions: under what circumstances learned
    models will be optimizers (including when they should not be), and, when a learned model is an optimizer,
    what its objective will be — how it will differ from the loss function it was trained under — and
    how it can be aligned.'
  source: SRC-PAPER-002
  section_or_page: arXiv abstract page (re-verified 2026-10-21; page matches the existing register entry)
  evidence_strength: direct abstract read
  assumptions: the abstract accurately represents the paper's scope
  counterevidence: The paper's finer distinctions (inner/outer alignment, mesa vs base objective usage)
    are not fully visible at abstract level; the existing register entry records the same limitation and
    defers them to a full-text read before chapter 07 leans on them.
  date: 2026-10-21
- id: CLM-0023
  claim: 'The Defining and Characterizing Reward Hacking abstract (arXiv:2209.13085; Skalse, Howe, Krasheninnikov,
    Krueger; v1 2022-09-27, v2 2025-03-05) states: reward hacking is a phenomenon where optimizing an
    imperfect proxy reward function leads to poor performance according to the true reward function; a
    proxy is unhackable if increasing expected proxy return can never decrease expected true return; and,
    because reward is linear in state-action visit counts, over the set of all stochastic policies two
    reward functions can be unhackable only if one of them is constant — revealing a tension between using
    reward functions to specify narrow tasks and aligning AI systems with human values.'
  source: SRC-PAPER-006
  section_or_page: arXiv abstract page
  evidence_strength: direct abstract read
  assumptions: the abstract accurately represents the theorems' scope; the formal conditions are stated
    over the paper's MDP formalization
  counterevidence: The deterministic-policy and finite-stochastic-policy results (non-trivial unhackable
    pairs, existence conditions for simplifications) are only named, not stated, in the abstract; precise
    statement forms are pending a full-text read.
  date: 2026-10-21
- id: CLM-0024
  claim: 'The Effects of Reward Misspecification abstract (arXiv:2201.03544; Pan, Bhatia, Steinhardt;
    v1 2022-01-10, v2 2022-02-14) states: the authors construct four RL environments with misspecified
    rewards and study reward hacking as a function of agent capabilities (model capacity, action space
    resolution, observation space noise, training time); more capable agents often exploit reward misspecifications,
    achieving higher proxy reward and lower true reward than less capable agents; instances of phase transitions
    occur — capability thresholds at which the agent''s behavior qualitatively shifts, leading to a sharp
    decrease in true reward; and the authors propose an anomaly-detection task for aberrant policies with
    several baseline detectors.'
  source: SRC-PAPER-007
  section_or_page: arXiv abstract page
  evidence_strength: direct abstract read
  assumptions: the abstract accurately represents the experiments; the enumerated capability axes transfer
    to the chapter's 'capability' framing only as a labeled analogy
  counterevidence: No quantitative threshold values, environment details, or detector performance appear
    in the abstract; toy-RL scale means external validity to LLM post-training is unestablished.
  date: 2026-10-21
- id: CLM-0025
  claim: 'The Goal Misgeneralization abstract (arXiv:2210.01790; Shah, Varma, Kumar, Phuong, Krakovna,
    Uesato, Kenton; v1 2022-10-04, v2 2022-11-02) states: goal misgeneralization is a specific form of
    robustness failure for learning algorithms in which the learned program competently pursues an undesired
    goal that leads to good performance in training situations but bad performance in novel test situations;
    it can occur even when the designer-provided specification is correct, unlike specification gaming,
    which requires a specification flawed in a way designers did not foresee; the authors demonstrate
    goal misgeneralization in deep learning systems across a variety of domains, extrapolate hypothetical
    catastrophic risks for more capable systems, and suggest research directions that could reduce the
    risk.'
  source: SRC-PAPER-008
  section_or_page: arXiv abstract page
  evidence_strength: direct abstract read
  assumptions: the abstract accurately represents the paper's scope; the demonstrated examples' details
    are pending full-text read
  counterevidence: The catastrophic-risk scenarios are explicitly hypothetical extrapolations by the authors,
    not demonstrated results; the course must label them as such wherever they are mentioned.
  date: 2026-10-21
- id: CLM-0026
  claim: InstructGPT outputs from a 1.3B-parameter model fine-tuned with human feedback (labeler demonstrations
    plus rankings of model outputs, then RL) were preferred to outputs from the 175B GPT-3 model in human
    evaluations on the authors' prompt distribution, despite ~100x fewer parameters.
  source: SRC-PAPER-009
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch; authors' own evaluation
  assumptions: the abstract accurately reports the paper's human-preference evaluations; 'preferred' is
    on the authors' prompt distribution with their labelers
  counterevidence: the same abstract reports minimal public-NLP-dataset regressions — distribution-specific
    preference, not a universal superiority claim; no independent replication cited
  date: 2026-10-21
- id: CLM-0027
  claim: DPO introduces a parameterization of the reward model in RLHF under which the corresponding optimal
    policy is available in closed form, yielding a stable classification-loss algorithm that eliminates
    reward model fitting and sampling during fine-tuning; the paper's title is the sentence 'Your Language
    Model is Secretly a Reward Model', and its abstract characterizes standard RLHF as 'complex and often
    unstable'.
  source: SRC-PAPER-010
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch; quoted fragments are short and pointed
  assumptions: the closed-form derivation in the full text matches the abstract's program; the course
    re-derived the steps itself and verified them numerically
  counterevidence: the abstract's own experiments are the authors' tasks (sentiment control, summarization,
    single-turn dialogue); instability claims about PPO-RLHF are the authors' characterization on their
    setups
  date: 2026-10-21
- id: CLM-0028
  claim: 'Constitutional AI trains a harmless-but-non-evasive assistant in two phases: a supervised phase
    (sample from an initial model, generate self-critiques and revisions, finetune on the revised responses)
    and a reinforcement learning phase (sample from the finetuned model, use a model to judge which of
    two samples is better, train with RL from AI Feedback using that preference model as reward).'
  source: SRC-PAPER-011
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch
  assumptions: the abstract accurately describes the method structure
  counterevidence: internal self-evaluation by the authors' organization; judge-human agreement numbers
    are in the unread full text and are not cited
  date: 2026-10-21
- id: CLM-0029
  claim: Ziegler et al.'s abstract states that their summarization models trained on 60,000 comparisons
    'may be exploiting the fact that labelers rely on simple heuristics' — a published, in-abstract admission
    that preference labels can be heuristic-driven rather than value-expressive.
  source: SRC-PAPER-012
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch; short quoted fragment with pointer
  assumptions: the quoted fragment is faithful to the fetched abstract text
  counterevidence: the authors hedge with 'may'; the effect size of heuristic labels is not quantified
    in the abstract
  date: 2026-10-21
- id: CLM-0030
  claim: When finetuning GPT-4 with a GPT-2-level supervisor and an auxiliary confidence loss, the authors
    report recovering close to GPT-3.5-level performance on NLP tasks — naive finetuning on weak labels
    already elicits more than the weak supervisor has.
  source: SRC-PAPER-013
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch; authors' own evaluation
  assumptions: the abstract accurately reports the weak-to-strong experiments; 'close to GPT-3.5' is the
    authors' characterization on their NLP task suite
  counterevidence: the same abstract states they are still far from recovering full strong-model capabilities
    with naive finetuning — the gap-closing is partial, task-suite-specific, and uses an auxiliary loss
    the naive baseline lacks
  date: 2026-10-21
- id: CLM-0031
  claim: Bowman et al. center their experimental design on breakthrough tasks — tasks where human specialists
    succeed but unaided humans and current general AI systems fail — and find that human participants
    interacting with an unreliable LLM dialog assistant (a trivial baseline oversight strategy) substantially
    outperform both the model alone and their own unaided performance.
  source: SRC-PAPER-014
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch
  assumptions: the abstract accurately reports the participant study design and outcome
  counterevidence: the paper's own framing calls the assistant condition a trivial baseline; the course
    adds that the unaided floor may be depressed by the time-limited format — neither caveat is a replication
  date: 2026-10-21
- id: CLM-0032
  claim: In the debate paper's MNIST experiment, competing agents that take turns revealing pixels boost
    a sparse-pixel classifier's accuracy from 59.4% to 88.9% given 6 visible pixels and from 48.2% to
    85.2% given 4 pixels.
  source: SRC-PAPER-015
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch; exact numbers quoted from the fetched abstract
  assumptions: the abstract accurately reports the experiment
  counterevidence: the judge is a classifier, not a human persuadable by arguments; the gains are existence
    proofs of debate-style information gain in a toy perceptual domain, not evidence about language-domain
    debate
  date: 2026-10-21
- id: CLM-0033
  claim: The weak-to-strong abstract states that techniques like RLHF may scale poorly to superhuman models
    without dedicated work — humans will eventually only weakly supervise systems more capable than they
    are.
  source: SRC-PAPER-013
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch
  assumptions: the abstract faithfully states the paper's motivation
  counterevidence: a motivation statement, not a demonstrated result; the demonstrated experiments are
    sub-human-gap analogues
  date: 2026-10-21
- id: CLM-0110
  claim: The XSTest paper (arXiv 2308.01263) designs its suite as 250 safe prompts across ten prompt types
    plus 200 unsafe contrast prompts — the paired safe/unsafe structure that P01's synthetic fixture models
    at the metadata level (never redistributing XSTest content).
  source: SRC-DATASET-006
  section_or_page: source-register entry (abstract-read, accessed 2026-10-21); datasets/cards/06-xstest.md
  evidence_strength: register-anchored, abstract-read level
  assumptions: the register entry and card accurately record the abstract-level composition
  counterevidence: none sought; composition facts were verified in the dataset-catalog round
  date: 2026-10-21
- id: CLM-0111
  claim: The Wilson score interval formulation (center and half-width as implemented in metrics.py per
    Ch. 02) matches the formulation stated on the inspected reference page — cross-checked before the
    harness's known-value tests were trusted; the tests then enforce the formula independently (e.g. 494/520
    -> [92.8%, 96.6%]).
  source: SRC-TOOL-001
  section_or_page: page section 'Wilson score interval'
  evidence_strength: page-inspected cross-check plus test-enforced known values
  assumptions: the encyclopedia page states the standard Wilson (1927) formulation; the course's authority
    is its own derivation and tests, the page is the cross-check
  counterevidence: none; the formula is classical and the known-value tests are independent of the page
  date: 2026-10-21
- id: CLM-0034
  claim: Kadavath et al. present self-evaluation channels for language models — notably P(True), where
    the model assesses the truth of a proposed answer, considering many of its own samples first — with
    encouraging performance and calibration reported on a diverse array of tasks, framed explicitly as
    groundwork for training more honest models.
  source: SRC-PAPER-016
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch; authors' own evaluations
  assumptions: the abstract accurately represents the paper's self-evaluation results
  counterevidence: self-evaluation inherits the model's blind spots — a confidently-wrong model self-certifies;
    the paper's own title hedges with 'mostly'
  date: 2026-10-21
- id: CLM-0035
  claim: The same paper reports that models can behave appropriately when relevant source material enters
    their context — the knowledge-state (P(IK)) channel responds to context, which also makes it spoofable
    by irrelevant source text.
  source: SRC-PAPER-016
  section_or_page: arXiv abstract page (fetched 2026-10-21)
  evidence_strength: abstract-read, single fetch
