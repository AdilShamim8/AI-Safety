# Claims register — claim-level evidence tracking.
#
# Each entry: id, claim, source (source-register ID), section_or_page,
# evidence_strength, assumptions, counterevidence, date.
#
# Purpose: keep every substantive claim in this repository falsifiable and
# traceable. Conjecture stays out of authoritative prose unless labeled.

claims:
  - id: CLM-0001
    claim: >-
      The reference article "AI Safety: From First Principles to Practice" was
      accessible in full (introduction, sections 1-11, and both closing resource
      lists) without a paywall during an automated fetch on 2026-10-21.
    source: SRC-ARTICLE-001
    section_or_page: "full article (automated fetch)"
    evidence_strength: "direct observation, single fetch session"
    assumptions: "paywall status is session- and region-dependent; 'accessible' means the fetched HTML contained the listed sections"
    counterevidence: >-
      The project brief prepared on 2026-10-20 recorded full-text access to the
      same URL as blocked during preparation. Both observations are recorded; the
      discrepancy is unexplained and does not affect any technical claim.
    date: 2026-10-21

