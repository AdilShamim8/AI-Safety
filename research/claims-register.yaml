  - id: CLM-0031
    claim: >-
      Bowman et al. center their experimental design on breakthrough tasks — tasks where human specialists succeed but unaided humans and current general AI systems fail — and find that human participants interacting with an unreliable LLM dialog assistant (a trivial baseline oversight strategy) substantially outperform both the model alone and their own unaided performance.
    source: SRC-PAPER-014
    section_or_page: "arXiv abstract page (fetched 2026-10-21)"
    evidence_strength: "abstract-read, single fetch"
    assumptions: "the abstract accurately reports the participant study design and outcome"
    counterevidence: >-
      the paper's own framing calls the assistant condition a trivial baseline; the course adds that the unaided floor may be depressed by the time-limited format — neither caveat is a replication
    date: 2026-10-21
  - id: CLM-0032
    claim: >-
      In the debate paper's MNIST experiment, competing agents that take turns revealing pixels boost a sparse-pixel classifier's accuracy from 59.4% to 88.9% given 6 visible pixels and from 48.2% to 85.2% given 4 pixels.
    source: SRC-PAPER-015
    section_or_page: "arXiv abstract page (fetched 2026-10-21)"
    evidence_strength: "abstract-read, single fetch; exact numbers quoted from the fetched abstract"
    assumptions: "the abstract accurately reports the experiment"
    counterevidence: >-
