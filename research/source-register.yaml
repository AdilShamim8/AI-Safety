  evidence_class: synthesis
  peer_review_status: unknown
  supports:
  - research/research-method.md (index comparison)
  - AWESOME.md design (category coverage check)
  limitations: README inspected only. Roughly 124 entries organized by topic category (ML foundations,
    prompt injection, adversarial attacks, poisoning and backdoors, privacy and extraction, tools, AI
    pentesting, benchmarks and standards, books, communities). No per-entry difficulty or prerequisite
    metadata observed. No license file referenced on the inspected page; entries were not individually
    verified through this list. No commit SHA captured at access time.
  license: unknown
- id: SRC-LIST-002
  title: awesome-ai-safety
  authors_or_organization: AbdelStark and contributors
  url: https://github.com/AbdelStark/awesome-ai-safety
