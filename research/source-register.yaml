  evidence_class: synthesis
  peer_review_status: unknown
  supports:
  - research/research-method.md (curriculum comparison)
  - planning/content-matrix.yaml (coverage cross-check)
  limitations: 'Landing page inspected only. Observed chapter listing: Chapter 0 Fundamentals, Chapter
    1 Transformer Interpretability, Chapter 2 Reinforcement Learning, Chapter 3 LLM Evaluations, Chapter
    4 Alignment Science, plus capstone projects. Unit-level content, exercise banks, and assessment structure
    were not inspected. Reuse governed by ARENA partnership guidelines (attribution, distinct branding,
    permission for group use); used here strictly as an organizational reference — no material copied.
    No commit SHA captured at access time.'
  license: unknown (partnership guidelines; not an open-content license)
- id: SRC-CURR-002
