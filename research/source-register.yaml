- id: SRC-ARTICLE-001
  title: 'AI Safety: From First Principles to Practice'
  authors_or_organization: Adil Shamim
  url: https://adilshamim8.medium.com/ai-safety-from-first-principles-to-practice-73ccd3ea73a0
  source_type: commentary
  publication_date: 2026-10-20
  version: null
  accessed_on: 2026-10-21
  access_level: full-text-read
  evidence_class: synthesis
  peer_review_status: not peer reviewed (single-author article)
  supports:
  - research/reference-article-map.md (theme-to-module table)
  - course framing and module ordering
  limitations: Publication date derived from the platform's relative timestamp at fetch time ("23 hours
    ago" on 2026-10-21), so day-level precision only. Conclusion section not retrieved in the fetch session.
    Owner-authored inspiration source; treated as framing, never as independent validation of technical
    claims. Medium platform terms apply to the original text; no lengthy passages reproduced.
  license: unknown (Medium platform terms; no open license observed)
- id: SRC-CURR-001
  title: ARENA curriculum
  authors_or_organization: ARENA (arena.education)
  url: https://www.arena.education/curriculum
