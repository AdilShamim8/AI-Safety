# Source register — verified entries only.
#
# Schema (per project brief): id, title, authors_or_organization, url, source_type,
# publication_date (verified or null), version, accessed_on (actual access date),
# access_level, evidence_class, peer_review_status, supports, limitations, license.
#
# Rules:
# - Add an entry only after an actual fetch/inspection on the recorded date.
# - access_level: full-text-read | abstract-read | page-inspected | metadata-only | unavailable
# - publication_date is a VERIFIED date or null. Never infer it from a URL or a memory.
# - A source URL returning 200 does not validate a scientific claim (see research-method.md).

