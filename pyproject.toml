[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisafety"
version = "0.1.0"
description = "AI safety toolkit: PII redaction, prompt-injection detection, guardrails, and benchmark harnesses grounded in real public datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AdilShamim8" }]
keywords = [
    "ai-safety",
    "llm-safety",
    "guardrails",
    "prompt-injection",
    "pii-redaction",
    "alignment",
    "red-teaming",
    "truthfulqa",
    "responsible-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=2.19.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]
nlp = [
    "transformers>=4.44.0",
    "torch>=2.3.0",
    "scikit-learn>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/AdilShamim8/AI-Safety"
Issues = "https://github.com/AdilShamim8/AI-Safety/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisafety = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # assert statements are fine in tests

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
