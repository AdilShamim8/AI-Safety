version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      dev-deps:
        applies-to: "version-updates"
        patterns:
          - "pytest*"
          - "ruff"
          - "black"
          - "mypy"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    labels: ["dependencies", "ci"]
