name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies (core + dev, from lockfile)
        run: uv sync --frozen
      - name: Repository validation (register schemas, local links, sizes)
        run: uv run python scripts/validate_repo.py .
      - name: Tests
        run: uv run pytest
      - name: Lint (scripts, tests)
        run: uv run ruff check scripts tests
      - name: Format check (scripts, tests)
        run: uv run black --check scripts tests
