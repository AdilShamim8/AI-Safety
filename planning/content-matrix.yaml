from_scratch:
  title: AI Researcher From Scratch (owner-directed track)
  path: research/ai-researcher-from-scratch/
  sources:
  - SRC-VIDEO-001
  - SRC-REPO-001
  provenance_note: 'Owner-directed addition (2026-10-22): the track distills the video "Become AI Researcher
    From Scratch - Full Course" (Vuk Rosic, 2025, CC-BY, page-inspected) and its MIT-licensed companion
    repository zero-to-ai-researcher (cloned and read 2026-10-22) into module notes plus a stdlib-only
    from-scratch code package (src/ai_safety_course/from_scratch/) with tests. No spoken-transcript content
    is quoted; the video could not be transcribed at fetch time.'
  modules:
  - id: FS-01
    title: Math foundations
    note: 01-math-foundations.md
    code: from_scratch/tensors.py
    maturity: complete
