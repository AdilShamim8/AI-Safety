# Content matrix — chapter/project inventory with truthful maturity.
#
# Schema per chapter: id, title, path, phase, maturity, outcomes, prerequisites,
# project_ids, assessments, source_ids (verified readings), verified_on.
# Schema per project: id, title, path, phase, maturity, chapter_links,
# artifacts, status (protocol-only | implemented | smoke-tested |
# experiment-executed | independently-reproduced), verified_on.
#
# maturity: planned | drafting | complete   — "complete" only when the unit's
# definition of done in planning/BUILD_PLAN.md is fully met.
# status is the honest execution status of project code+experiments.

