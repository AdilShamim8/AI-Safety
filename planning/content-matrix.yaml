- id: '14'
  title: Agent, tool, memory, and MCP security
  path: chapters/14-agent-tool-memory-mcp-security/
  phase: F
  maturity: complete
  outcomes:
  - Define capability, least privilege, and confused deputy; explain why an agent holding user credentials
    over untrusted context is the deputy
  - Separate control flow from data flow in an agent trace; reproduce the Dual LLM residual argument-corruption
    flaw and the CaMeL capability-layer fix
  - State the MCP trust rules (descriptions untrusted; protocol cannot enforce its own security principles)
    and connect tool poisoning to them
  - Build the privilege and trust-boundary matrix; identify exfiltration pairs and the authority gradient;
    write R1-R4 capability rules
  - Explain memory persistence as widened attack window (dormancy, provenance loss, re-privileging) and
    price agent-security claims with intervals
  prerequisites:
